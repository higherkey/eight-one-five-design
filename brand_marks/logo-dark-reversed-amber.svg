<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip area restricting shapes strictly inside the re-centered main circle -->
    <clipPath id="main-circle-interior-dark-reversed-amber">
      <circle cx="185" cy="215" r="154" />
    </clipPath>
  </defs>

  <!-- Solar Eclipse Logo (Dark Theme - Reversed Amber Center: Dark Top-Right Exterior, Amber Main Center, Grey Bottom-Left Interior Crescent) -->
  
  <!-- 1. Top-Right Exposed Dark Navy Circle -->
  <circle cx="215" cy="185" r="160" fill="#0B0F19" />

  <!-- 2. Main Circle Base (Slate Grey #8A9BB4 Base) -->
  <circle cx="185" cy="215" r="160" fill="#8A9BB4" />

  <!-- 3. Amber Inner Mask Circle (covers top-right & center with Warm Amber #D97706, leaving grey crescent on BOTTOM-LEFT) -->
  <circle cx="215" cy="185" r="154" fill="#D97706" clip-path="url(#main-circle-interior-dark-reversed-amber)" />

  <!-- 4. Main Circle Outer Keyline Ring (Linen Light Stroke) -->
  <circle cx="185" cy="215" r="154" fill="none" stroke="#FDFBF7" stroke-width="12" />
</svg>
