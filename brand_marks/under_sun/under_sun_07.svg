<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Var 07: Intersecting Pedestal -->
  <!-- Offset Sun shifted down to intersect top step -->
  <circle cx="200" cy="170" r="60" fill="#D97706" />
  <circle cx="212" cy="158" r="60" fill="#FDFBF7" />
  <circle cx="212" cy="158" r="57" fill="none" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Split horizontal steps to allow overlap space -->
  <g stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round">
    <line x1="80" y1="310" x2="160" y2="310" />
    <line x1="240" y1="310" x2="320" y2="310" />
    <line x1="120" y1="270" x2="175" y2="270" />
    <line x1="225" y1="270" x2="280" y2="270" />
  </g>
  <line x1="160" y1="230" x2="240" y2="230" stroke="#D97706" stroke-width="3.5" stroke-linecap="round" />
</svg>