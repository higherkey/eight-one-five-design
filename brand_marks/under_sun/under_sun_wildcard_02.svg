<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 02: Equilibrium Balance -->
  <line x1="100" y1="240" x2="300" y2="240" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <polygon points="200,240 220,320 180,320" fill="#1A1A1A" />
  
  <!-- Left Side: Sun (Play/Light) -->
  <g transform="translate(100, 240)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#1A1A1A" stroke-width="1.5" />
    <circle cx="0" cy="50" r="25" fill="#D97706" />
    <circle cx="6" cy="44" r="25" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="1.5" />
  </g>
  
  <!-- Right Side: Foundation Steps (Work/Structure) -->
  <g transform="translate(300, 240)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#1A1A1A" stroke-width="1.5" />
    <line x1="-30" y1="60" x2="30" y2="60" stroke="#1A1A1A" stroke-width="5" />
    <line x1="-20" y1="45" x2="20" y2="45" stroke="#D97706" stroke-width="3.5" />
    <line x1="-10" y1="30" x2="10" y2="30" stroke="#1A1A1A" stroke-width="2.5" />
  </g>
</svg>