<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Var 14: Inward Taper Plumb -->
  <!-- Upper Sun -->
  <circle cx="200" cy="130" r="55" fill="#D97706" />
  <circle cx="212" cy="118" r="55" fill="#FDFBF7" />
  <circle cx="212" cy="118" r="52" fill="none" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Plumb center line -->
  <line x1="200" y1="180" x2="200" y2="340" stroke="#D97706" stroke-width="2.5" />
  <circle cx="200" cy="340" r="5" fill="#D97706" />
  
  <!-- Inward Tapering Steps -->
  <line x1="70" y1="290" x2="330" y2="290" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  <line x1="110" y1="250" x2="290" y2="250" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="210" x2="250" y2="210" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
</svg>