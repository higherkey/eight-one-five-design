<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 07: Swing Pendulum -->
  <!-- Upper stable sun -->
  <circle cx="200" cy="130" r="50" fill="#D97706" />
  <circle cx="212" cy="118" r="50" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Pendulum swing arm (Playful motion) -->
  <line x1="200" y1="130" x2="140" y2="280" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="140" cy="280" r="16" fill="#D97706" />
  
  <!-- Intersected foundation steps below -->
  <line x1="80" y1="320" x2="320" y2="320" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" />
  <line x1="120" y1="300" x2="280" y2="300" stroke="#EFEBE4" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="280" x2="240" y2="280" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
</svg>