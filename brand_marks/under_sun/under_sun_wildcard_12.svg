  <circle cx="200" cy="130" r="50" fill="none" stroke="#D97706" stroke-width="2" />
  
  <!-- Solid offset center -->
  <circle cx="200" cy="130" r="20" fill="#1A1A1A" />
  <circle cx="206" cy="124" r="20" fill="#FDFBF7" stroke="#D97706" stroke-width="2" />
  
  <!-- Nested squares below -->
  <rect x="80" y="220" width="240" height="100" fill="none" stroke="#1A1A1A" stroke-width="4" />
  <rect x="120" y="250" width="160" height="70" fill="none" stroke="#1A1A1A" stroke-width="3" />
  <rect x="160" y="280" width="80" height="40" fill="#D97706" />
