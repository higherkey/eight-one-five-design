<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 11: Double Helix Plinth -->
  <!-- Upper Sun -->
  <circle cx="200" cy="120" r="45" fill="#D97706" />
  <circle cx="210" cy="110" r="45" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Double Helix structure linking sun to base (Work of life/nature) -->
  <path d="M 180 160 C 180 200 220 220 220 260" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
  <path d="M 220 160 C 220 200 180 220 180 260" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  
  <path d="M 180 260 C 180 300 220 300 220 310" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
  <path d="M 220 260 C 220 300 180 300 180 310" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  
  <!-- Connections -->
  <line x1="183" y1="185" x2="217" y2="185" stroke="#1A1A1A" stroke-width="1.5" />
  <line x1="183" y1="235" x2="217" y2="235" stroke="#1A1A1A" stroke-width="1.5" />
  <line x1="183" y1="285" x2="217" y2="285" stroke="#1A1A1A" stroke-width="1.5" />
  
  <!-- Plinth steps -->
  <line x1="80" y1="330" x2="320" y2="330" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  <line x1="130" y1="310" x2="270" y2="310" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />
</svg>