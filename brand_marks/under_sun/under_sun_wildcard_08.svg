<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 08: Woven Infinity Steps -->
  <!-- Upper Sun -->
  <circle cx="200" cy="130" r="50" fill="#D97706" />
  <circle cx="212" cy="118" r="50" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Infinity loop twisting through foundation steps -->
  <path d="M 150 250 C 150 290 190 290 200 250 C 210 210 250 210 250 250 C 250 290 210 290 200 250 C 190 210 150 210 150 250 Z" fill="none" stroke="#D97706" stroke-width="4.5" />
  
  <!-- Foundation steps -->
  <line x1="80" y1="310" x2="320" y2="310" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" />
  <line x1="120" y1="270" x2="280" y2="270" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="230" x2="240" y2="230" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
</svg>