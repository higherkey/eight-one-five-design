<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Var 11: Ladder Foundation -->
  <!-- Upper Sun -->
  <circle cx="200" cy="135" r="55" fill="#D97706" />
  <circle cx="212" cy="123" r="55" fill="#FDFBF7" />
  <circle cx="212" cy="123" r="52" fill="none" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Steps with vertical supporting struts -->
  <line x1="100" y1="290" x2="300" y2="290" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  <line x1="100" y1="240" x2="300" y2="240" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
  <line x1="100" y1="190" x2="300" y2="190" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
  
  <!-- Struts -->
  <line x1="150" y1="190" x2="150" y2="290" stroke="#1A1A1A" stroke-width="1.5" />
  <line x1="250" y1="190" x2="250" y2="290" stroke="#1A1A1A" stroke-width="1.5" />
</svg>