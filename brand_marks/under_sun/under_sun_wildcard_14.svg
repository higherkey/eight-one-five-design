<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 14: Mountain plinths -->
  <!-- Giant offset sun in background -->
  <circle cx="200" cy="160" r="90" fill="#D97706" fill-opacity="0.08" stroke="#D97706" stroke-width="1.5" stroke-dasharray="10 5" />
  <circle cx="200" cy="160" r="60" fill="#D97706" />
  <circle cx="215" cy="145" r="60" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Stepped Mountain Peaks (Work / Play horizons) -->
  <polygon points="120,310 200,210 280,310" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
  <polygon points="70,310 140,240 210,310" fill="none" stroke="#D97706" stroke-width="3" stroke-linejoin="round" />
  <polygon points="190,310 260,230 330,310" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Horizontal steps base -->
  <line x1="50" y1="310" x2="350" y2="310" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" />
</svg>