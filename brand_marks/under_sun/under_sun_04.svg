<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Var 04: Floating Base Orbits -->
  <!-- Upper Sun -->
  <circle cx="200" cy="150" r="65" fill="#D97706" />
  <circle cx="212" cy="138" r="65" fill="#FDFBF7" />
  <circle cx="212" cy="138" r="62" fill="none" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Thick Solid Base -->
  <line x1="80" y1="300" x2="320" y2="300" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round" />
  
  <!-- Playful floating bubbles in the middle gap -->
  <circle cx="140" cy="250" r="10" fill="none" stroke="#D97706" stroke-width="2.5" />
  <circle cx="200" cy="245" r="16" fill="none" stroke="#D97706" stroke-width="3" />
  <circle cx="260" cy="250" r="10" fill="none" stroke="#D97706" stroke-width="2.5" />
</svg>