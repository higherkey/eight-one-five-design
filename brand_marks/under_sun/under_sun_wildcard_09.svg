<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 09: Tectonic Tree -->
  <!-- Crown: Offset Sun Eclipse -->
  <circle cx="200" cy="130" r="60" fill="#D97706" />
  <circle cx="212" cy="118" r="60" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Trunk -->
  <line x1="200" y1="190" x2="200" y2="260" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Stepped roots representing solid anchor -->
  <line x1="80" y1="320" x2="320" y2="320" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" />
  <line x1="120" y1="290" x2="280" y2="290" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="260" x2="240" y2="260" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
</svg>