<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Var 19: Dropshadow Meridian -->
  <!-- Upper Sun -->
  <circle cx="200" cy="130" r="55" fill="#D97706" />
  <circle cx="212" cy="118" r="55" fill="#FDFBF7" />
  <circle cx="212" cy="118" r="52" fill="none" stroke="#1A1A1A" stroke-width="3" />
  
  <!-- Drop lines linking sun to foundation steps -->
  <g stroke="#EFEBE4" stroke-width="2">
    <line x1="140" y1="180" x2="140" y2="290" />
    <line x1="200" y1="180" x2="200" y2="250" />
    <line x1="260" y1="180" x2="260" y2="290" />
  </g>
  
  <line x1="80" y1="290" x2="320" y2="290" stroke="#1A1A1A" stroke-width="5.5" stroke-linecap="round" />
  <line x1="120" y1="250" x2="280" y2="250" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
  <line x1="160" y1="210" x2="240" y2="210" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" />
</svg>