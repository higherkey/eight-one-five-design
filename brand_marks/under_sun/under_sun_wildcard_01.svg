<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- SUN-08 + WIS-10 Wildcard 01: Eclipse Hourglass -->
  <!-- Upper half solar glass -->
  <path d="M 120 100 L 280 100 L 200 200 Z" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
  <!-- Lower half stepped glass -->
  <path d="M 200 200 L 280 300 L 120 300 Z" fill="none" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Sun inside top -->
  <circle cx="200" cy="135" r="25" fill="#D97706" />
  <circle cx="206" cy="129" r="25" fill="#FDFBF7" stroke="#1A1A1A" stroke-width="1.5" />
  
  <!-- Falling sand steps in bottom -->
  <line x1="170" y1="240" x2="230" y2="240" stroke="#D97706" stroke-width="3" stroke-linecap="round" />
  <line x1="150" y1="270" x2="250" y2="270" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
  <line x1="130" y1="290" x2="270" y2="290" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
</svg>