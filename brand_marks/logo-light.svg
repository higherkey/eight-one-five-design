<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip area restricting the interior of the main circle -->
    <clipPath id="main-circle-interior">
      <circle cx="215" cy="185" r="154" />
    </clipPath>
  </defs>

  <!-- Solar Eclipse Logo (Light Theme - Grey Crescent Top-Right, White Main Center) -->
  
  <!-- 1. Bottom-Left Exposed Amber Sun Circle -->
  <circle cx="185" cy="215" r="160" fill="#D97706" />

  <!-- 2. Main Eclipsing Moon Circle Base (Grey #4E5A70 Base) -->
  <circle cx="215" cy="185" r="160" fill="#4E5A70" />

  <!-- 3. White Inner Mask Circle (covers center/bottom-left with white, leaving grey crescent on TOP-RIGHT) -->
  <circle cx="185" cy="215" r="154" fill="#FDFBF7" clip-path="url(#main-circle-interior)" />

  <!-- 4. Eclipsing Moon Outer Keyline Ring -->
  <circle cx="215" cy="185" r="154" fill="none" stroke="#0B0F19" stroke-width="12" />
</svg>
