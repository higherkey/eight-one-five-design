<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip area restricting interior of main circle -->
    <clipPath id="main-circle-interior-dark-reversed">
      <circle cx="185" cy="215" r="154" />
    </clipPath>
  </defs>

  <!-- Solar Eclipse Logo (Dark Theme - Re-centered: Top-Right Orange Exterior, Full-Size Bottom-Left Grey Interior Crescent, Dark Main Center) -->
  
  <!-- 1. Top-Right Exposed Amber Sun Circle -->
  <circle cx="215" cy="185" r="160" fill="#D97706" />

  <!-- 2. Main Circle Base (Slate Grey #8A9BB4 Base) -->
  <circle cx="185" cy="215" r="160" fill="#8A9BB4" />

  <!-- 3. Obsidian Dark Inner Mask Circle (Standard offset at 215, 185: leaves full-size grey crescent on BOTTOM-LEFT) -->
  <circle cx="215" cy="185" r="154" fill="#0B0F19" clip-path="url(#main-circle-interior-dark-reversed)" />

  <!-- 4. Main Circle Outer Keyline Ring (Linen Light Stroke) -->
  <circle cx="185" cy="215" r="154" fill="none" stroke="#FDFBF7" stroke-width="12" />
</svg>
