<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="background-color:#FDFBF7;">
  <rect width="400" height="400" fill="#FDFBF7" />
  <!-- WIS-05: Symmetric Scales -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round" />
  <line x1="200" y1="120" x2="200" y2="320" stroke="#1A1A1A" stroke-width="3" />
  <line x1="160" y1="320" x2="240" y2="320" stroke="#1A1A1A" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="200" r="20" fill="none" stroke="#D97706" stroke-width="3" />
  <circle cx="300" cy="200" r="20" fill="none" stroke="#D97706" stroke-width="3" />
  <line x1="100" y1="120" x2="100" y2="180" stroke="#1A1A1A" stroke-width="1.5" />
  <line x1="300" y1="120" x2="300" y2="180" stroke="#1A1A1A" stroke-width="1.5" />
</svg>