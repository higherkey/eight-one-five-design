<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip area restricting the interior of the main circle -->
    <clipPath id="main-circle-interior-dark-swapped">
      <circle cx="215" cy="185" r="154" />
    </clipPath>
  </defs>

  <!-- Solar Eclipse Logo (Dark Theme - Full-Size Grey Exterior Crescent, Orange Top-Right Interior Crescent) -->
  
  <!-- 1. Bottom-Left Exposed Slate Grey Sun Circle (Slate Grey #8A9BB4 - Standard Offset at 185, 215) -->
  <circle cx="185" cy="215" r="160" fill="#8A9BB4" />

  <!-- 2. Main Eclipsing Moon Circle Base (Warm Amber #D97706 Base for interior crescent) -->
  <circle cx="215" cy="185" r="160" fill="#D97706" />

  <!-- 3. Obsidian Dark Inner Mask Circle (covers center/bottom-left with dark navy #0B0F19, leaving orange crescent on TOP-RIGHT) -->
  <circle cx="185" cy="215" r="154" fill="#0B0F19" clip-path="url(#main-circle-interior-dark-swapped)" />

  <!-- 4. Eclipsing Moon Outer Keyline Ring (Linen Light Stroke) -->
  <circle cx="215" cy="185" r="154" fill="none" stroke="#FDFBF7" stroke-width="12" />
</svg>
