<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Clip area restricting shapes strictly inside the re-centered main circle -->
    <clipPath id="main-circle-interior-centered">
      <circle cx="185" cy="215" r="154" />
    </clipPath>
  </defs>

  <!-- Solar Eclipse Logo (Light Theme - Re-centered: Top-Right Orange Exterior, Full-Size Bottom-Left Grey Interior Crescent) -->
  
  <!-- 1. Top-Right Exposed Amber Sun Circle -->
  <circle cx="215" cy="185" r="160" fill="#D97706" />

  <!-- 2. Main Circle Base (Muted Navy-Grey #4E5A70 Base) -->
  <circle cx="185" cy="215" r="160" fill="#4E5A70" />

  <!-- 3. White Inner Mask Circle (Standard offset at 215, 185: leaves full-size grey crescent on BOTTOM-LEFT) -->
  <circle cx="215" cy="185" r="154" fill="#FDFBF7" clip-path="url(#main-circle-interior-centered)" />

  <!-- 4. Main Circle Outer Keyline Ring -->
  <circle cx="185" cy="215" r="154" fill="none" stroke="#0B0F19" stroke-width="12" />
</svg>
